[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codoxear"
version = "0.1.0"
description = "Rust-only mobile handoff UI assets and contract-test package for Codex/Pi sessions."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []

[tool.setuptools]
packages = ["codoxear"]
include-package-data = true

[tool.setuptools.package-data]
codoxear = ["static/*", "static/dist/**/*", "static/dist/.vite/manifest.json"]

[tool.pytest.ini_options]
markers = [
  "contract: Rust-only HTTP/disk contract tests",
]
