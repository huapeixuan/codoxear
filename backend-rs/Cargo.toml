[package]
name = "codoxear-backend-rs"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "codoxear-backend-rs"
path = "src/main.rs"

[[bin]]
name = "codoxear-broker-rs"
path = "src/bin/codoxear-broker-rs.rs"

[dependencies]
axum = { version = "0.7.9", features = ["macros", "json"] }
base64 = "0.22.1"
hmac = "0.12.1"
indexmap = "=2.2.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tokio = { version = "1.36.0", features = ["full"] }
toml = "=0.8.8"
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.5.2", features = ["cors", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "=0.1.3"
hyper = { version = "=1.9.0" }
tempfile = "3"
